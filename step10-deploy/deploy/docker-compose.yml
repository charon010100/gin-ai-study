# docker-compose.yml —— 一条命令把「应用 + 数据库 + 缓存 + 反向代理」拉起来
#
# 这个文件同时是一份「依赖顺序」的说明书：谁必须先健康，谁才能启动。
#
# 用法：
#   cd deploy
#   cp .env.example .env      # 改掉里面的密码
#   docker compose up -d --build
#   curl http://localhost:8080/api/v1/articles
#
# 注意：版本号没写 `version:` 字段。Compose V2 已不再需要它，
# 留着只会让 `docker compose` 报 "the attribute `version` is obsolete" 警告。

services:
  # ── 数据库 ──
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      # 时区。不设置的话容器默认 UTC，而很多人以为是本地时间，
      # 于是「数据库里存的时间比实际早 8 小时」这类问题会反复出现。
      # 应用侧统一用 UTC 存储、由前端本地化，这里保持 UTC 更一致。
      TZ: UTC
    volumes:
      - mysql_data:/var/lib/mysql
    # 健康检查决定 app 是否开始启动。没有它，app 会在 MySQL 还没准备好接受连接时
    # 启动并因为「连接被拒绝」而退出，靠 restart 策略反复重启 —— 能跑起来，但日志很吓人。
    healthcheck:
      # 用 mysqladmin ping 而不是 `nc -z 3306`：端口通了不代表数据库初始化完了
      # （MySQL 首次启动要先建系统表，这个阶段端口已经监听但拒绝认证连接）。
      # $$ 是 compose 的转义，表示「把 $ 传给容器内的 shell」，
      # 由 shell 展开容器自己的环境变量 —— 这样密码不会出现在宿主机进程列表里。
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u\"$$MYSQL_USER\" -p\"$$MYSQL_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  # ── 缓存 ──
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # 用 sh -c + exec：
    #   - 需要 shell 来展开 $$REDIS_PASSWORD（command 数组形式不会做容器内变量展开）；
    #   - exec 让 redis-server 取代 sh 成为 PID 1，否则 SIGTERM 发给 sh，
    #     redis 不会被优雅关闭，可能丢掉 AOF 缓冲的最后一点数据。
    command:
      - sh
      - -c
      - exec redis-server --requirepass "$$REDIS_PASSWORD" --appendonly yes
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      # 供健康检查使用：redis-cli 会自动读取 REDISCLI_AUTH，无需在命令行里传密码。
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      # REDISCLI_AUTH 是 redis-cli 官方支持的取密码方式（见上面的 environment）。
      # 不要用 redis-cli -a password：命令行参数会出现在进程列表里，
      # 同机任何用户都能看到密码。
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  # ── 数据库迁移（一次性任务）──
  #
  # 迁移单独成一个服务，而不是在 app 启动时执行，理由在 NOTES 里有完整对比。
  # 关键点：app 与迁移是两个镜像，迁移失败时 app 根本不会启动
  # （service_completed_successfully 的语义），于是「表结构不对还对外服务」不可能发生。
  migrate:
    # 版本号写死，不要用 latest：latest 会在某次重启时静默换成新版本，
    # 而迁移工具的行为变化可能直接改错表结构。
    # 这个 tag 发布于 2023 年底，可按需要升到更新的 4.x 版本。
    image: migrate/migrate:v4.17.0
    restart: "no"
    volumes:
      - ./migrations:/migrations:ro
    command:
      - "-path=/migrations"
      - "-database=mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@tcp(mysql:3306)/${MYSQL_DATABASE}?multiStatements=true"
      - "up"
    depends_on:
      mysql:
        condition: service_healthy

  # ── 应用 ──
  app:
    build:
      # 构建上下文是项目根目录（上两级），因为 Dockerfile 里要 COPY go.mod 和源码。
      # 写成相对 compose 文件的路径，这样在任何工作目录下执行 compose 都正确。
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        # 把版本号传进构建，最终注入二进制的 main.version。
        VERSION: ${APP_VERSION:-dev}
    restart: unless-stopped
    environment:
      APP_ENV: prod
      APP_ADDR: ":8080"
      SHUTDOWN_TIMEOUT: "15"
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_DB: "0"
      LOG_LEVEL: info
      GIN_MODE: release
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        # 注意这个条件是 service_completed_successfully，不是 service_started。
        # service_started 只保证迁移容器「启动过」，迁移可能还在跑、甚至即将失败；
        # service_completed_successfully 要求它以退出码 0 结束，否则 app 不会启动。
        condition: service_completed_successfully
    # 给优雅关停留出时间。默认 stop 超时是 10 秒，而本应用的 SHUTDOWN_TIMEOUT 是 15 秒，
    # 不开这个配置的话，docker stop 会在 10 秒时发 SIGKILL，优雅关停等于白做。
    # 这个值必须大于 SHUTDOWN_TIMEOUT。
    stop_grace_period: 20s
    healthcheck:
      # 用镜像里的二进制自己探活，因为 distroless 没有 curl/wget/shell。
      test: ["CMD", "/server", "-healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 5
      # start_period 给应用留出启动时间。在这段时间内探测失败不计入 retries，
      # 否则冷启动慢一点就会被判定 unhealthy 并触发重启。
      start_period: 15s
    # 不对宿主机暴露端口：所有流量都从 nginx 进来，
    # 这样「绕过反向代理直连应用」在结构上就不可能发生。
    expose:
      - "8080"

  # ── 反向代理 ──
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/healthz || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

volumes:
  mysql_data:
  redis_data:
