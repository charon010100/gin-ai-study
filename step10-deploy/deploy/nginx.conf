# nginx.conf —— 反向代理配置（挂载到 /etc/nginx/conf.d/default.conf）
#
# 为什么要在应用前面放一层 nginx，而不是直接把 8080 端口暴露出去：
#   1. TLS 终结。证书管理交给 nginx，应用专注业务，不用处理证书轮换；
#   2. 缓冲慢客户端。nginx 会先把请求完整读进来再转给后端，
#      避免慢速攻击把应用的工作 goroutine 长期占住（应用侧的超时是最后一道防线）；
#   3. 统一入口。限流、压缩、安全头、静态资源可以在一处配好，不必改每个服务；
#   4. 应用可以在多个实例间做负载均衡，且实例重启时对外无感。

upstream app_backend {
    # 容器网络里用 compose 的服务名解析。
    # 多实例时在这里加多行 + 负载均衡策略（默认轮询）。
    server app:8080;
    # keepalive 复用与后端的长连接。
    # 不加的话每个请求都新建一次 TCP 连接，高频下会耗尽端口并增加延迟。
    # 注意配合下面的 proxy_http_version 1.1 和 Connection "" 才有效。
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # 请求体上限。默认 1MB 对上传图片/附件偏小，
    # 但也不能设成 0（不限）—— 那等于给了对方一个打满磁盘的方法。
    # 这个值应当与应用侧的限制一致，否则会出现「nginx 放行了，应用拒了」的困惑。
    client_max_body_size 10m;

    # 超时要大于应用的响应时间上限，否则 nginx 会先断开，
    # 应用还在干活，日志里出现一堆「客户端已断开」的 499。
    proxy_connect_timeout 5s;
    proxy_send_timeout    30s;
    proxy_read_timeout    30s;

    # 不把 nginx 版本号带回给客户端（默认会带在 Server 头和错误页里）。
    server_tokens off;

    # ── gzip ──
    # JSON 接口压缩收益明显（通常能压到原来的 20%~30%）。
    # 注意：不要对图片/视频再压缩，已经压缩过的数据只会浪费 CPU。
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml
        application/rss+xml;

    # ── 转发头 ──
    #
    # Host 必须透传，否则应用生成的绝对链接、重定向地址都会变成 app:8080。
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ── 关于 X-Forwarded-For 的一个重要前提 ──
    #
    # 上面两行之所以可用，前提是「**只有**你这层 nginx 能决定这个头的值」。
    #
    # X-Forwarded-For 是客户端可以自己伪造的：任何人发请求时加一行
    #   X-Forwarded-For: 1.2.3.4
    # 都能让应用以为请求来自 1.2.3.4。
    # $proxy_add_x_forwarded_for 的语义是「把客户端传来的值原样保留，再追加真实 IP」，
    # 所以应用如果取「第一个」IP，取到的就是伪造值；取最后一个才是 nginx 追加的真实 IP。
    #
    # 因此：
    #   - 应用侧必须明确「只信任最后一跳」或「信任哪些代理 IP」；
    #   - 如果 nginx 前面还有 CDN / 负载均衡，需要配 set_real_ip_from + real_ip_header，
    #     由 nginx 负责把伪造的部分清掉，再把可信结果传给应用：
    #
    #       set_real_ip_from 10.0.0.0/8;
    #       real_ip_header X-Forwarded-For;
    #       real_ip_recursive on;
    #
    # 为什么这件事值得单独说：应用里的限流、评论黑名单、审计日志全都依赖客户端 IP。
    # 如果 IP 可被伪造，这些防护全部形同虚设 —— 攻击者伪造一个新 IP 就能绕过限流。

    # 不让 nginx 把上游的 Server 头再透出去。
    proxy_hide_header X-Powered-By;

    # ── 路由 ──
    location / {
        proxy_pass http://app_backend;
        # 1.1 + 清空 Connection 是启用 keepalive 的标准写法。
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # 缓冲响应：nginx 先把响应收完再慢慢发给慢客户端，
        # 这样应用的连接可以尽快释放。
        proxy_buffering on;
    }

    # 探活接口只允许内网访问。
    # 健康检查本身不敏感，但它是「服务存活图谱」，暴露在公网等于告诉别人
    # 你有哪些实例、什么时候在重启。
    location = /healthz {
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
        proxy_pass http://app_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # 生产环境不要暴露 /debug/pprof。
    # net/http/pprof 提供 goroutine 栈、堆内存快照、CPU 采样，
    # 里面可能包含请求参数、数据库地址、内存中的用户数据。
    # 如果真的需要（比如线上排障），必须：
    #   a) 只在内网监听另一个端口，公网完全不转发；或
    #   b) 加一层 Basic Auth + IP 白名单。
    # 这里直接 404，把「忘了关」这个可能消灭掉。
    location /debug/ {
        return 404;
    }

    # ── 安全响应头 ──
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # ── TLS ──
    #
    # 上面的 listen 80 只适合本地验证。真正的上线至少要：
    #
    #   server {
    #       listen 443 ssl http2;
    #       server_name example.com;
    #       ssl_certificate     /etc/nginx/certs/fullchain.pem;
    #       ssl_certificate_key /etc/nginx/certs/privkey.pem;
    #       ssl_protocols TLSv1.2 TLSv1.3;
    #       add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    #       ...（把下面 location 里的内容复制过来）
    #   }
    #   server {
    #       listen 80;
    #       server_name example.com;
    #       return 301 https://$host$request_uri;
    #   }
    #
    # 证书用 certbot（Let's Encrypt）签发并自动续期即可。
    # 注意 HSTS 一旦下发，浏览器会在 max-age 内强制用 HTTPS 访问，
    # 如果证书配错且你已经下发了长期 HSTS，用户会被彻底挡在门外——
    # 所以第一次上线建议先用较短的 max-age（如 300 秒）验证通过后再调大。
}
